version: '3.9'
services:
  backend:
    restart: unless-stopped
    environment:
      APP_ENV: production
      MULTITENANT_MODE: strict
      DEFAULT_TENANT_REQUIRED: 'true'
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  middleware:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TENANT_HEADER_REQUIRED: 'true'
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  admin-frontend:
    restart: unless-stopped

  db:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
