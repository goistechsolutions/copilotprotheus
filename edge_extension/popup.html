<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Copilot Protheus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1>✦ Copilot Protheus</h1>
    <p class="subtitle">Assistente integrado ao WebApp da TOTVS</p>

    <button id="openProtheusBtn" class="btn btn-primary">Abrir no Protheus</button>
    <button id="toggleWidgetBtn" class="btn btn-secondary">Mostrar / Ocultar Widget</button>

    <p class="shortcut">Atalho: Ctrl+Shift+P</p>

    <hr>

    <label for="tenantId">Grupo/Tenant ID (Obrigatório):</label>
    <input type="text" id="tenantId" placeholder="rodol_prod">

    <label for="username">Usuário Copilot:</label>
    <input type="text" id="username" placeholder="admin">

    <label for="password">Senha Copilot:</label>
    <input type="password" id="password" placeholder="••••••••">

    <label for="widgetUrl">URL do Widget (Vite/Nuvem):</label>
    <input type="url" id="widgetUrl" placeholder="https://copilot.elitecorp.tec.br/">

    <label for="launchUrl">URL de Lançamento (FastAPI):</label>
    <input type="url" id="launchUrl" placeholder="https://copilot.elitecorp.tec.br/api/launch">

    <button id="saveConfigBtn" class="btn btn-primary">Salvar Configurações</button>

    <p id="statusMessage" class="status" aria-live="polite"></p>

    <a href="#" id="openOptionsLink">Configurações avançadas</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
