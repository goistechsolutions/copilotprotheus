<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Copilot Protheus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1>✦ Copilot Protheus</h1>
    <p class="subtitle">Assistente integrado ao WebApp da TOTVS</p>

    <button id="openProtheusBtn" class="btn btn-primary">Abrir no Protheus</button>
    <button id="toggleWidgetBtn" class="btn btn-secondary">Mostrar / Ocultar Widget</button>

    <p class="shortcut">Atalho: Ctrl+Shift+P</p>

    <hr>

    <label for="tenantId">Tenant ID (obrigatório):</label>
    <input type="text" id="tenantId" placeholder="rodol_prod" autocomplete="off">

    <label for="environmentCode">Environment code (obrigatório):</label>
    <input type="text" id="environmentCode" placeholder="c8te0u_prod" autocomplete="off">

    <label for="widgetUrl">URL do Widget:</label>
    <input type="url" id="widgetUrl" placeholder="https://copilot.elitecorp.tec.br/" autocomplete="url">

    <label for="launchUrl">URL de Lançamento do Protheus:</label>
    <input type="url" id="launchUrl" placeholder="https://host.protheus.cloudtotvs.com.br/webapp/index.html" autocomplete="url">

    <p class="hint">A extensão não armazena credenciais. O OAuth2 é executado no backend.</p>

    <button id="saveConfigBtn" class="btn btn-primary">Salvar Configurações</button>

    <p id="statusMessage" class="status" aria-live="polite"></p>

    <a href="#" id="openOptionsLink">Configurações avançadas</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
