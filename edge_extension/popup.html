<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Copilot Protheus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="brand">
        <span class="sparkle">✦</span>
        <h1>Copilot Protheus</h1>
      </div>
      <div class="status-badge">
        <span class="dot"></span>
        <span>Ativo</span>
      </div>
    </div>
    <p class="subtitle">Assistente Inteligente integrado ao WebApp TOTVS</p>

    <div class="quick-actions">
      <button id="openProtheusBtn" class="btn btn-primary">Abrir no Protheus</button>
      <button id="toggleWidgetBtn" class="btn btn-secondary">Alternar Widget</button>
    </div>

    <p class="shortcut">Atalho: Ctrl+Shift+P</p>

    <hr>

    <div class="form-group">
      <label for="tenantId">Tenant ID</label>
      <input type="text" id="tenantId" placeholder="Identificador do tenant" autocomplete="off" required>
    </div>

    <div class="form-group">
      <label for="environmentCode">Ambiente Protheus</label>
      <input type="text" id="environmentCode" placeholder="Código do ambiente Protheus" autocomplete="off" required>
    </div>

    <div class="form-group">
      <label for="username">Usuário</label>
      <input type="text" id="username" placeholder="Usuário do contexto (opcional)" autocomplete="username">
    </div>

    <p class="security-note">A extensão não armazena nem envia senha. A autenticação OAuth2 do Protheus é realizada exclusivamente pelo backend.</p>

    <div class="form-group">
      <label for="widgetUrl">URL do Frontend / Widget</label>
      <input type="url" id="widgetUrl" placeholder="URL pública do frontend do agente" autocomplete="url" required>
    </div>

    <div class="form-group">
      <label for="launchUrl">URL TOTVS Cloud WebApp</label>
      <input type="url" id="launchUrl" placeholder="URL do WebApp TOTVS" autocomplete="url" required>
    </div>

    <button id="saveConfigBtn" class="btn btn-save">Salvar Configurações</button>

    <p id="statusMessage" class="status" aria-live="polite"></p>

    <div class="footer-links">
      <a href="#" id="openOptionsLink">Opções Avançadas</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
