<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Copilot Protheus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="brand">
        <span class="sparkle">✦</span>
        <h1>Copilot Protheus</h1>
      </div>
      <div class="status-badge">
        <span class="dot"></span>
        <span>Ativo</span>
      </div>
    </div>
    <p class="subtitle">Assistente Inteligente integrado ao WebApp TOTVS</p>

    <div class="quick-actions">
      <button id="openProtheusBtn" class="btn btn-primary">Abrir no Protheus</button>
      <button id="toggleWidgetBtn" class="btn btn-secondary">Alternar Widget</button>
    </div>

    <p class="shortcut">Atalho: Ctrl+Shift+P</p>

    <hr>

    <div class="form-group">
      <label for="tenantId">Tenant ID</label>
      <input type="text" id="tenantId" placeholder="rodol_prod" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="environmentCode">Ambiente Protheus</label>
      <input type="text" id="environmentCode" placeholder="c8te0u_prod" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="username">Usuário</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <div class="form-group">
      <label for="widgetUrl">URL do Frontend / Widget</label>
      <input type="url" id="widgetUrl" placeholder="https://copilot.elitecorp.tec.br/" autocomplete="url">
    </div>

    <div class="form-group">
      <label for="launchUrl">URL TOTVS Cloud WebApp</label>
      <input type="url" id="launchUrl" placeholder="https://rodollta195384.protheus.cloudtotvs.com.br:10703/webapp/index.html" autocomplete="url">
    </div>

    <button id="saveConfigBtn" class="btn btn-save">Salvar Configurações</button>

    <p id="statusMessage" class="status" aria-live="polite"></p>

    <div class="footer-links">
      <a href="#" id="openOptionsLink">Opções Avançadas</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
