<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Configurações — Copilot Protheus</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <span class="sparkle">✦</span>
        <h1>Copilot Protheus</h1>
      </div>
      <p class="subtitle">Configuração do contexto de integração com o TOTVS Protheus</p>
    </div>

    <form id="config-form" class="card">
      <div class="form-group">
        <label for="tenantId">Tenant ID (obrigatório)</label>
        <input type="text" id="tenantId" required placeholder="ex: tenant_empresa" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="environmentCode">Ambiente Protheus / Environment Code (obrigatório)</label>
        <input type="text" id="environmentCode" required placeholder="ex: ambiente_protheus" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="username">Usuário Protheus</label>
        <input type="text" id="username" placeholder="ex: usuario_configurado" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Senha Protheus</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" id="togglePassword" aria-label="Mostrar senha">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="widgetUrl">URL do Frontend / Copilot Web</label>
        <input type="url" id="widgetUrl" required placeholder="https://copilot.elitecorp.tec.br/" autocomplete="url">
      </div>

      <div class="form-group">
        <label for="launchUrl">URL de Lançamento do Protheus WebApp</label>
        <input type="url" id="launchUrl" required placeholder="https://seu-servidor-protheus/webapp/index.html" autocomplete="url">
      </div>

      <div class="actions">
        <button type="button" id="testConnection" class="btn btn-secondary">Testar URL</button>
        <button type="submit" id="saveConfig" class="btn btn-primary">Salvar Configurações</button>
      </div>

      <p id="statusMessage" class="status" aria-live="polite"></p>
    </form>
  </div>
  <script src="options.js"></script>
</body>
</html>
