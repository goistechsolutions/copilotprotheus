<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Configurações — Copilot Protheus</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>✦ Copilot Protheus</h1>
    <p class="subtitle">Configuração do contexto de integração com o Protheus</p>

    <form id="config-form">
      <label for="tenantId">Tenant ID (obrigatório)</label>
      <input type="text" id="tenantId" required placeholder="ex: rodol_prod" autocomplete="off">

      <label for="environmentCode">Environment code (obrigatório)</label>
      <input type="text" id="environmentCode" required placeholder="ex: c8te0u_prod" autocomplete="off">

      <p class="hint">A extensão envia apenas o contexto operacional. A autenticação OAuth2 e as credenciais REST permanecem no backend.</p>

      <label for="widgetUrl">URL do Widget</label>
      <input type="url" id="widgetUrl" required placeholder="https://copilot.elitecorp.tec.br/" autocomplete="url">

      <label for="launchUrl">URL de Lançamento do Protheus</label>
      <input type="url" id="launchUrl" required placeholder="https://host.protheus.cloudtotvs.com.br/webapp/index.html" autocomplete="url">

      <div class="actions">
        <button type="button" id="testConnection">Testar URL de Lançamento</button>
        <button type="submit" id="saveConfig">Salvar Configurações</button>
      </div>

      <p id="statusMessage" class="status" aria-live="polite"></p>
    </form>
  </div>
  <script src="options.js"></script>
</body>
</html>
