# =============================================================================
# GitHub Actions — Deploy Backend CopilotProtheus
# Fluxo: Push main → Build Docker → SSH VPS → Migrations → Restart
# Cloudflare Tunnel expõe a API sem abrir portas
# =============================================================================

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'app/**'
      - 'database/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:
    inputs:
      deploy_vps:
        description: 'Executar deploy em VPS remota (SSH)?'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Testes e validação local
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Testes e Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint com flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Validar SQL migrations
        run: |
          echo "Validando sintaxe dos arquivos SQL..."
          for f in database/migrations/*.sql; do
            echo "→ Verificando: $f"
            python -c "
          import re, sys
          content = open('$f').read()
          # Verifica filtros obrigatórios nas views
          if 'CREATE OR REPLACE VIEW' in content:
              if \"D_E_L_E_T_\" not in content and \"d_e_l_e_t_\" not in content:
                  print('AVISO: View sem filtro D_E_L_E_T_ em $f')
          print('OK: $f')
          "
          done

  # ---------------------------------------------------------------------------
  # JOB 2: Deploy VPS (Desativado: Backend roda localmente via Cloudflare Tunnel)
  # Disponível apenas para acionamento manual se uma VPS for provisionada
  # ---------------------------------------------------------------------------
  deploy-vps:
    name: 🚀 Deploy VPS (Manual)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_vps == true
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Adicionar VPS ao known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sincronizar código para VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/copilotprotheus/

