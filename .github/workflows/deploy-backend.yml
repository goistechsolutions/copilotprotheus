name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint + Testes
  # ─────────────────────────────────────────────
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .env stub — satisfaz env_file do docker-compose no runner (valores fictícios)
      - name: Criar .env stub para o runner
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=stub-secret-key-for-ci
          POSTGRES_USER=copilotprotheus
          POSTGRES_DB=copilotprotheus
          POSTGRES_PASSWORD=stub-password-for-ci
          OPENAI_API_KEY=stub-openai-key-for-ci
          CLOUDFLARE_TUNNEL_TOKEN=stub-cf-token-for-ci
          CORS_ORIGINS=http://localhost
          DATABASE_URL=postgresql+asyncpg://copilotprotheus:stub@db:5432/copilotprotheus
          EOF

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        working-directory: backend
        run: |
          pip install flake8 --quiet
          flake8 app/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Type check (mypy)
        working-directory: backend
        run: |
          pip install mypy --quiet
          mypy app/ --ignore-missing-imports || true

  # ─────────────────────────────────────────────
  # JOB 2: Deploy + Migration na VPS Hetzner
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          ssh-keyscan -H -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy + Migration via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          ssh -p ${VPS_PORT:-22} \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            ${VPS_USER}@${VPS_HOST} \
            SECRET_KEY="${SECRET_KEY}" \
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            OPENAI_API_KEY="${OPENAI_API_KEY}" \
            CLOUDFLARE_TUNNEL_TOKEN="${CLOUDFLARE_TUNNEL_TOKEN}" \
            CORS_ORIGINS="${CORS_ORIGINS}" \
            bash -s << 'ENDSSH'

            set -euo pipefail
            APP_DIR="/root/copilotprotheus"

            # ── [1/7] Atualiza repositório ──────────────────────────────────
            echo "==> [1/7] Atualizando repositorio..."
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            # ── [2/7] Gera .env real na VPS ─────────────────────────────────
            echo "==> [2/7] Criando .env na VPS..."
            cat > "$APP_DIR/.env" << ENVEOF
SECRET_KEY=${SECRET_KEY}
POSTGRES_USER=copilotprotheus
POSTGRES_DB=copilotprotheus
POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
OPENAI_API_KEY=${OPENAI_API_KEY}
CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
CORS_ORIGINS=${CORS_ORIGINS}
DATABASE_URL=postgresql+asyncpg://copilotprotheus:${POSTGRES_PASSWORD}@db:5432/copilotprotheus
ENVEOF
            chmod 600 "$APP_DIR/.env"
            echo "   .env criado com sucesso."

            # ── [3/7] Build e sobe containers ───────────────────────────────
            echo "==> [3/7] Build e subindo containers..."
            cd "$APP_DIR"
            docker compose pull --quiet || true
            docker compose up -d --build --remove-orphans

            # ── [4/7] Aguarda PostgreSQL healthy ────────────────────────────
            echo "==> [4/7] Aguardando PostgreSQL ficar pronto..."
            MAX_TRIES=40
            COUNT=0
            until docker compose exec -T db pg_isready -U copilotprotheus -d copilotprotheus -q 2>/dev/null; do
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge $MAX_TRIES ]; then
                echo "ERRO: PostgreSQL nao ficou pronto apos ${MAX_TRIES} tentativas."
                docker compose logs db --tail=30
                exit 1
              fi
              echo "   Aguardando PostgreSQL... tentativa ${COUNT}/${MAX_TRIES}"
              sleep 3
            done
            echo "   PostgreSQL pronto!"

            # ── [5/7] Aguarda backend saudavel ──────────────────────────────
            echo "==> [5/7] Aguardando container backend ficar healthy..."
            COUNT=0
            until [ "$(docker inspect --format='{{.State.Status}}' copilot-protheus-backend 2>/dev/null)" = "running" ]; do
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge 20 ]; then
                echo "ERRO: Container backend nao iniciou."
                docker compose logs backend --tail=30
                exit 1
              fi
              echo "   Aguardando backend... tentativa ${COUNT}/20"
              sleep 3
            done
            echo "   Backend em execucao!"

            # ── [6/7] Executa migration Alembic ─────────────────────────────
            echo "==> [6/7] Executando migration Alembic..."
            echo "   >> alembic current (estado antes da migration):"
            docker compose exec -T backend alembic current 2>&1 || true

            echo "   >> alembic upgrade head:"
            if docker compose exec -T backend alembic upgrade head 2>&1; then
              echo "   Migration executada com sucesso!"
            else
              MIGRATION_EXIT=$?
              echo "ERRO: Migration falhou com codigo ${MIGRATION_EXIT}."
              echo "   >> Log do backend:"
              docker compose logs backend --tail=50
              echo "   >> alembic history:"
              docker compose exec -T backend alembic history 2>&1 || true
              exit ${MIGRATION_EXIT}
            fi

            echo "   >> alembic current (estado apos a migration):"
            docker compose exec -T backend alembic current 2>&1 || true

            # ── [7/7] Seed do dicionario Protheus ───────────────────────────
            echo "==> [7/7] Seed do dicionario Protheus..."
            docker compose exec -T backend python scripts/seed_protheus_dicionario.py 2>&1 \
              && echo "   Seed executado!" \
              || echo "   Seed ja executado ou nao critico — continuando."

            echo ""
            echo "==> Deploy concluido com sucesso! $(date -u)"
            echo ""
            docker compose ps
          ENDSSH

      - name: Verify health endpoint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p ${VPS_PORT:-22} \
            -o StrictHostKeyChecking=no \
            ${VPS_USER}@${VPS_HOST} \
            "curl -sf http://localhost:8000/health && echo 'Health OK' || echo '[AVISO] Health check falhou'"

      - name: Notify deploy status
        if: always()
        run: |
          echo "======================================"
          echo " Deploy finalizado"
          echo " Status  : ${{ job.status }}"
          echo " Branch  : ${{ github.ref_name }}"
          echo " Commit  : ${{ github.sha }}"
          echo " Ator    : ${{ github.actor }}"
          echo "======================================"
