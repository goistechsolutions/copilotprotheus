# ─────────────────────────────────────────────────────────────────────────────
# Deploy Backend → Hetzner VPS
# Branch main  → ambiente production  (secrets prefixo PROD_)
# Branch hml   → ambiente homologation (secrets prefixo HML_)
#
# Secrets necessários no repositório (Settings → Secrets → Actions):
#
#   PROD_VPS_HOST            IP/hostname do VPS de produção
#   PROD_VPS_USER            Usuário SSH de produção
#   PROD_VPS_SSH_KEY         Chave privada SSH de produção
#   PROD_VPS_PORT            Porta SSH (default 22)
#   PROD_SECRET_KEY          openssl rand -hex 32
#   PROD_POSTGRES_PASSWORD   Senha forte do banco
#   PROD_OPENAI_API_KEY      Chave OpenAI de produção
#   PROD_CLOUDFLARE_TUNNEL_TOKEN   Token do túnel Cloudflare
#   PROD_CORS_ORIGINS        Domínios separados por vírgula
#
#   HML_VPS_HOST             (idem acima para hml)
#   HML_VPS_USER
#   HML_VPS_SSH_KEY
#   HML_VPS_PORT
#   HML_SECRET_KEY
#   HML_POSTGRES_PASSWORD
#   HML_OPENAI_API_KEY
#   HML_CLOUDFLARE_TUNNEL_TOKEN
#   HML_CORS_ORIGINS
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Backend → Hetzner VPS

on:
  push:
    branches: [main, hml]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: SSH Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    # Resolve variáveis de ambiente com base no branch que disparou o workflow
    env:
      APP_ENV:        ${{ github.ref_name == 'main' && 'production'    || 'homologation' }}
      VPS_HOST:       ${{ github.ref_name == 'main' && secrets.PROD_VPS_HOST       || secrets.HML_VPS_HOST }}
      VPS_USER:       ${{ github.ref_name == 'main' && secrets.PROD_VPS_USER       || secrets.HML_VPS_USER }}
      VPS_SSH_KEY:    ${{ github.ref_name == 'main' && secrets.PROD_VPS_SSH_KEY    || secrets.HML_VPS_SSH_KEY }}
      VPS_PORT:       ${{ github.ref_name == 'main' && secrets.PROD_VPS_PORT       || secrets.HML_VPS_PORT }}
      SECRET_KEY:     ${{ github.ref_name == 'main' && secrets.PROD_SECRET_KEY     || secrets.HML_SECRET_KEY }}
      POSTGRES_PASS:  ${{ github.ref_name == 'main' && secrets.PROD_POSTGRES_PASSWORD || secrets.HML_POSTGRES_PASSWORD }}
      OPENAI_KEY:     ${{ github.ref_name == 'main' && secrets.PROD_OPENAI_API_KEY || secrets.HML_OPENAI_API_KEY }}
      CF_TOKEN:       ${{ github.ref_name == 'main' && secrets.PROD_CLOUDFLARE_TUNNEL_TOKEN || secrets.HML_CLOUDFLARE_TUNNEL_TOKEN }}
      CORS_ORIGINS:   ${{ github.ref_name == 'main' && secrets.PROD_CORS_ORIGINS   || secrets.HML_CORS_ORIGINS }}
      HEALTH_PORT:    ${{ github.ref_name == 'main' && '8000' || '8001' }}
      DEPLOY_DIR:     ${{ github.ref_name == 'main' && '/opt/copilotprotheus' || '/opt/copilotprotheus-hml' }}

    steps:
      - uses: actions/checkout@v4

      # ── 1. Deploy via SSH ──────────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ env.VPS_SSH_KEY }}
          port:     ${{ env.VPS_PORT }}
          envs:     APP_ENV,SECRET_KEY,POSTGRES_PASS,OPENAI_KEY,CF_TOKEN,CORS_ORIGINS,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            echo "==> [⚑ $APP_ENV] Atualizando código..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "==> Escrevendo .env ($APP_ENV)..."
            cat > .env <<EOF
            ENVIRONMENT=$APP_ENV
            DEBUG=false
            LOG_LEVEL=$( [ "$APP_ENV" = "production" ] && echo 'WARNING' || echo 'INFO' )
            SECRET_KEY=$SECRET_KEY
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=$POSTGRES_PASS
            POSTGRES_DB=copilot_protheus_$( [ "$APP_ENV" = "production" ] && echo '' || echo 'hml' | sed 's/^_//' )
            DATABASE_URL=postgresql+psycopg2://postgres:$POSTGRES_PASS@db:5432/copilot_protheus$( [ "$APP_ENV" = "production" ] && echo '' || echo '_hml' )
            OPENAI_API_KEY=$OPENAI_KEY
            LLM_MODEL=gpt-4o-mini
            EMBEDDING_MODEL=text-embedding-3-small
            CLOUDFLARE_TUNNEL_TOKEN=$CF_TOKEN
            CORS_ORIGINS=$CORS_ORIGINS
            EOF
            chmod 600 .env

            echo "==> Subindo containers..."
            docker compose pull --ignore-pull-failures || true
            docker compose up -d --build --force-recreate backend

            echo "==> Executando migrations Alembic..."
            docker compose exec -T backend alembic upgrade head

            echo "✅ Backend [$APP_ENV] atualizado em $(date)"

      # ── 2. Smoke test — health check remoto ────────────────────────────────
      - name: Smoke Test — Health Check
        run: |
          sleep 20
          curl --fail --retry 5 --retry-delay 5 \
            http://${{ env.VPS_HOST }}:${{ env.HEALTH_PORT }}/health || \
            (echo "❌ Health check falhou! Ambiente: ${{ env.APP_ENV }}" && exit 1)

      # ── 3. Notifica falha ──────────────────────────────────────────────────
      - name: Notificar falha
        if: failure()
        run: |
          echo "::error::Deploy [${{ env.APP_ENV }}] ou health check falhou. Branch: ${{ github.ref_name }}. Revise os logs acima."
