name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint + Testes rapidos
  # ─────────────────────────────────────────────
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cria .env stub no runner para satisfazer env_file do docker-compose
      # e eventuais imports do app que carregam dotenv na inicializacao
      - name: Criar .env stub para o runner
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=stub-secret-key-for-ci
          POSTGRES_USER=copilotprotheus
          POSTGRES_DB=copilotprotheus
          POSTGRES_PASSWORD=stub-password-for-ci
          OPENAI_API_KEY=stub-openai-key-for-ci
          CLOUDFLARE_TUNNEL_TOKEN=stub-cf-token-for-ci
          CORS_ORIGINS=http://localhost
          DATABASE_URL=postgresql+asyncpg://copilotprotheus:stub@db:5432/copilotprotheus
          EOF

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        working-directory: backend
        run: |
          pip install flake8 --quiet
          flake8 app/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Type check (mypy)
        working-directory: backend
        run: |
          pip install mypy --quiet
          mypy app/ --ignore-missing-imports || true

  # ─────────────────────────────────────────────
  # JOB 2: Deploy na VPS Hetzner
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          ssh-keyscan -H -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          ssh -p ${VPS_PORT:-22} ${VPS_USER}@${VPS_HOST} \
            -o StrictHostKeyChecking=no \
            -o SendEnv="SECRET_KEY POSTGRES_PASSWORD OPENAI_API_KEY CLOUDFLARE_TUNNEL_TOKEN CORS_ORIGINS" \
            bash -s << 'ENDSSH'

            set -e
            APP_DIR="/root/copilotprotheus"

            echo "==> [1/6] Atualizando repositorio..."
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "==> [2/6] Criando .env na VPS..."
            cat > "$APP_DIR/.env" << ENVEOF
SECRET_KEY=${SECRET_KEY}
POSTGRES_USER=copilotprotheus
POSTGRES_DB=copilotprotheus
POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
OPENAI_API_KEY=${OPENAI_API_KEY}
CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
CORS_ORIGINS=${CORS_ORIGINS}
DATABASE_URL=postgresql+asyncpg://copilotprotheus:${POSTGRES_PASSWORD}@db:5432/copilotprotheus
ENVEOF
            chmod 600 "$APP_DIR/.env"

            echo "==> [3/6] Build e subindo containers..."
            cd "$APP_DIR"
            docker compose pull --quiet
            docker compose up -d --build --remove-orphans

            echo "==> [4/6] Aguardando PostgreSQL estar pronto..."
            for i in $(seq 1 30); do
              if docker compose exec -T db pg_isready -U copilotprotheus -q 2>/dev/null; then
                echo "   PostgreSQL pronto!"
                break
              fi
              echo "   Aguardando... tentativa $i/30"
              sleep 3
            done

            echo "==> [5/6] Executando migrations Alembic..."
            docker compose exec -T backend alembic upgrade head

            echo "==> [6/6] Executando seed do dicionario Protheus..."
            docker compose exec -T backend python scripts/seed_protheus_dicionario.py || echo "   Seed ja executado ou nao critico."

            echo "==> Deploy concluido com sucesso!"
            docker compose ps
          ENDSSH

      - name: Verify health endpoint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p ${VPS_PORT:-22} ${VPS_USER}@${VPS_HOST} \
            -o StrictHostKeyChecking=no \
            "curl -sf http://localhost:8000/health || echo '[AVISO] Health check falhou'"

      - name: Notify deploy status
        if: always()
        run: |
          echo "Deploy finalizado. Status: ${{ job.status }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Acionado por: ${{ github.actor }}"
