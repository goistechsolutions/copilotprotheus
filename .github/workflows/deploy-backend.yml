# ─────────────────────────────────────────────────────────────────────────────
# Deploy Backend → Hetzner VPS
# Branch main → production   (usa os secrets existentes sem prefixo)
# Branch hml  → homologation (usa os mesmos secrets — mesmo servidor, pasta hml)
#
# Secrets necessários (Settings → Secrets → Actions):
#
#   VPS_HOST                IP/hostname do servidor Hetzner
#   VPS_USER                Usuário SSH
#   VPS_SSH_KEY             Chave privada SSH (conteúdo do id_ed25519)
#   VPS_PORT                Porta SSH (padrão: 22)
#   SECRET_KEY              openssl rand -hex 32
#   POSTGRES_PASSWORD       Senha forte do banco
#   OPENAI_API_KEY          Chave da OpenAI
#   CLOUDFLARE_TUNNEL_TOKEN Token do túnel Cloudflare
#   CORS_ORIGINS            Domínios separados por vírgula
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Backend → Hetzner VPS

on:
  push:
    branches: [main, hml]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: SSH Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    env:
      # Derivados do branch — sem prefixo nos secrets
      APP_ENV:     ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
      DEBUG:       ${{ github.ref_name == 'main' && 'false' || 'false' }}
      LOG_LEVEL:   ${{ github.ref_name == 'main' && 'WARNING' || 'INFO' }}
      DB_SUFFIX:   ${{ github.ref_name == 'main' && '' || '_hml' }}
      DEPLOY_DIR:  ${{ github.ref_name == 'main' && '/opt/copilotprotheus' || '/opt/copilotprotheus-hml' }}
      HEALTH_PORT: ${{ github.ref_name == 'main' && '8000' || '8001' }}

    steps:
      - uses: actions/checkout@v4

      # ── 1. Deploy via SSH ────────────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          envs:     APP_ENV,DEBUG,LOG_LEVEL,DB_SUFFIX,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            echo "==> [⚑ $APP_ENV] Atualizando código..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "==> Escrevendo .env ($APP_ENV)..."
            cat > .env <<EOF
            ENVIRONMENT=$APP_ENV
            DEBUG=$DEBUG
            LOG_LEVEL=$LOG_LEVEL
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=copilot_protheus$DB_SUFFIX
            DATABASE_URL=postgresql+psycopg2://postgres:${{ secrets.POSTGRES_PASSWORD }}@db:5432/copilot_protheus$DB_SUFFIX
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            LLM_MODEL=gpt-4o-mini
            EMBEDDING_MODEL=text-embedding-3-small
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            EOF
            chmod 600 .env

            echo "==> Subindo containers..."
            docker compose pull --ignore-pull-failures || true
            docker compose up -d --build --force-recreate backend

            echo "==> Executando migrations Alembic..."
            docker compose exec -T backend alembic upgrade head

            echo "✅ Backend [$APP_ENV] atualizado em $(date)"

      # ── 2. Smoke test ────────────────────────────────────────────────────────
      - name: Smoke Test — Health Check
        run: |
          sleep 20
          curl --fail --retry 5 --retry-delay 5 \
            http://${{ secrets.VPS_HOST }}:${{ env.HEALTH_PORT }}/health || \
            (echo "❌ Health check falhou! Ambiente: ${{ env.APP_ENV }}" && exit 1)

      # ── 3. Notifica falha ────────────────────────────────────────────────────
      - name: Notificar falha
        if: failure()
        run: |
          echo "::error::Deploy [${{ env.APP_ENV }}] ou health check falhou. Branch: ${{ github.ref_name }}."
