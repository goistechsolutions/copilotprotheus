# =============================================================================
# GitHub Actions — Deploy Backend CopilotProtheus
# Fluxo: Push main → Build Docker → SSH VPS → Migrations → Restart
# Cloudflare Tunnel expõe a API sem abrir portas
# =============================================================================

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'app/**'
      - 'database/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:   # permite rodar manualmente pelo GitHub

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Testes e validação local
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Testes e Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint com flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Validar SQL migrations
        run: |
          echo "Validando sintaxe dos arquivos SQL..."
          for f in database/migrations/*.sql; do
            echo "→ Verificando: $f"
            python -c "
          import re, sys
          content = open('$f').read()
          # Verifica filtros obrigatórios nas views
          if 'CREATE OR REPLACE VIEW' in content:
              if \"D_E_L_E_T_\" not in content and \"d_e_l_e_t_\" not in content:
                  print('AVISO: View sem filtro D_E_L_E_T_ em $f')
          print('OK: $f')
          "
          done

  # ---------------------------------------------------------------------------
  # JOB 2: Deploy na VPS via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy VPS
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Adicionar VPS ao known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # -------------------------------------------------------------------------
      # FIX 1: Usar printf em vez de heredoc com aspas simples.
      # Heredoc << 'ENVCMD' bloqueia a expansão de ${{ secrets.* }} pelo runner.
      # Com printf, as variáveis são expandidas pelo GitHub Actions ANTES do SSH.
      # -------------------------------------------------------------------------
      - name: Criar .env na VPS
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /root/copilotprotheus && chmod 700 /root/copilotprotheus"

          printf '%s\n' \
            "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            "DEBUG=false" \
            "ENVIRONMENT=production" \
            "" \
            "# PostgreSQL" \
            "POSTGRES_HOST=db" \
            "POSTGRES_PORT=5432" \
            "POSTGRES_DB=copilotprotheus" \
            "POSTGRES_USER=copilot" \
            "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
            "DATABASE_URL=postgresql://copilot:${{ secrets.POSTGRES_PASSWORD }}@db:5432/copilotprotheus" \
            "" \
            "# OpenAI" \
            "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            "OPENAI_MODEL=gpt-4o" \
            "" \
            "# Gemini" \
            "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            "" \
            "# Cloudflare" \
            "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" \
            "" \
            "# CORS" \
            "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" \
          | ssh -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cat > /root/copilotprotheus/.env && chmod 600 /root/copilotprotheus/.env && echo '✅ .env criado'"

      - name: Sincronizar código para VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/copilotprotheus/

      # -------------------------------------------------------------------------
      # FIX 2: Copiar cada SQL para dentro do container antes de executar psql.
      # O redirecionamento < "$sql_file" falha silenciosamente quando o arquivo
      # está no host e o container não tem acesso ao path do host.
      # Usando docker cp + psql -f /tmp/migration.sql dentro do container.
      # -------------------------------------------------------------------------
      - name: Executar deploy e migrations
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOYCMD'
            set -e
            cd /root/copilotprotheus

            echo "📦 Parando containers antigos..."
            docker compose down --remove-orphans || true

            echo "🏗️ Build da imagem..."
            docker compose build --no-cache

            echo "🗃️ Subindo apenas o banco de dados..."
            docker compose up -d db

            echo "⏳ Aguardando PostgreSQL aceitar conexões..."
            for i in $(seq 1 15); do
              docker compose exec -T db pg_isready -U copilot -d copilotprotheus && break
              echo "  tentativa $i/15..."
              sleep 2
            done

            echo "🔄 Executando migrations SQL..."
            SQL_COUNT=0
            for sql_file in database/migrations/*.sql; do
              [ -f "$sql_file" ] || { echo "⚠️  Nenhum arquivo SQL encontrado em database/migrations/"; break; }
              SQL_COUNT=$((SQL_COUNT + 1))
              BASENAME=$(basename "$sql_file")
              echo "→ Copiando $BASENAME para container..."
              docker cp "$sql_file" "$(docker compose ps -q db)":/tmp/"$BASENAME"
              echo "→ Aplicando $BASENAME..."
              docker compose exec -T db psql \
                -U copilot \
                -d copilotprotheus \
                -f /tmp/"$BASENAME" \
                && echo "  ✅ $BASENAME aplicado" \
                || echo "  ⚠️  $BASENAME: já aplicado ou erro não crítico"
            done
            echo "📊 Total de migrations processadas: $SQL_COUNT"

            echo "🚀 Subindo todos os serviços..."
            docker compose up -d

            echo "⏳ Aguardando inicialização..."
            sleep 10

            echo "✅ Status dos containers:"
            docker compose ps

            echo "📋 Logs recentes:"
            docker compose logs --tail=20
          DEPLOYCMD

      - name: Health check da API
        run: |
          echo "Aguardando 15s para a API inicializar..."
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${{ secrets.API_HEALTH_URL || 'https://api.copilotprotheus.com.br/health' }}" || echo "000")
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "000" ]; then
            echo "⚠️ API respondeu com status $HTTP_CODE (pode ser normal no primeiro deploy)"
          else
            echo "✅ API operacional"
          fi
        continue-on-error: true

      - name: Notificar conclusão
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy concluído com sucesso em $(date)"
          else
            echo "❌ Deploy falhou em $(date)"
          fi

  # ---------------------------------------------------------------------------
  # JOB 3: Backup do PostgreSQL antes de migrations (apenas segundas e sextas)
  # ---------------------------------------------------------------------------
  backup-db:
    name: 🗄️ Backup PostgreSQL
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Configurar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Adicionar VPS ao known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Realizar backup pg_dump
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'BACKUPCMD'
            set -e
            BACKUP_DIR="/root/copilotprotheus/backups"
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/backup_$(date +%Y%m%d_%H%M%S).sql.gz"
            docker compose exec -T db pg_dump \
              -U copilot copilotprotheus | gzip > "$BACKUP_FILE"
            echo "✅ Backup criado: $BACKUP_FILE"
            # Mantém apenas os 7 backups mais recentes
            ls -t "$BACKUP_DIR"/backup_*.sql.gz | tail -n +8 | xargs -r rm
            echo "📦 Backups disponíveis:"
            ls -lh "$BACKUP_DIR"
          BACKUPCMD
        continue-on-error: true
