name: Deploy Backend → Hetzner VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/copilotprotheus
            git fetch origin main
            git reset --hard origin/main
            docker compose pull --ignore-pull-failures || true
            docker compose up -d --build --force-recreate backend
            docker compose exec -T backend alembic upgrade head
            echo "✅ Backend atualizado em $(date)"

      - name: Smoke Test — Health Check
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 5 \
            https://${{ secrets.VPS_HOST }}/health || \
            (echo "❌ Health check falhou!" && exit 1)

      - name: Notificar falha
        if: failure()
        run: |
          echo "::error::Deploy falhou — verifique os logs do job"
          # Aqui pode chamar webhook Slack/Teams se quiser
