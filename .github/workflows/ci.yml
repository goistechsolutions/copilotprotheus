name: CI — Lint & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-test:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estrutura backend
        run: |
          test -f requirements.txt || (echo "::error::backend/requirements.txt não encontrado." && exit 1)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar dependências de teste
        run: pip install pytest pytest-asyncio httpx

      - name: Verificar se pasta tests/ existe
        id: check_tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/ 2>/dev/null)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Pasta tests/ não encontrada ou vazia — pulando pytest"
          fi

      - name: Executar testes
        if: steps.check_tests.outputs.has_tests == 'true'
        run: pytest tests/ -q --tb=short

  frontend-build:
    name: Admin Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estrutura frontend
        run: |
          test -f package.json || (echo "::error::admin-frontend/package.json não encontrado." && exit 1)
          test -f package-lock.json || (echo "::error::admin-frontend/package-lock.json não encontrado. Faça commit do lockfile." && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Build de validação
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
