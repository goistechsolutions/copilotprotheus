# =============================================================
# GitHub Actions — Deploy + Migrations PostgreSQL
# Repositório: goistechsolutions/copilotprotheus
#
# Fluxo:
#   1. Push na branch main
#   2. Build e teste da aplicação
#   3. SSH na VPS Hetzner
#   4. Pull do código mais recente
#   5. Executa migrations SQL (database/migrations/)
#   6. Reinicia containers Docker
#   7. Health check via Cloudflare Tunnel
# =============================================================

name: 🚀 Deploy + DB Migrations

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Executar migrations SQL?'
        required: false
        default: 'true'
        type: boolean
      wipe_database:
        description: 'CUIDADO: Apagar o banco de dados atual e recriar do zero? (Destrutivo)'
        required: false
        default: 'false'
        type: boolean

env:
  DEPLOY_DIR: /root/copilotprotheus
  COMPOSE_FILE: docker-compose.yml

jobs:
  # ----------------------------------------------------------
  # JOB 1: Lint e validação rápida
  # ----------------------------------------------------------
  lint:
    name: 🔍 Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Validar arquivos SQL de migration
        run: |
          echo "Verificando arquivos SQL em database/migrations/"
          find database/migrations -name "*.sql" | sort | while read f; do
            echo "  ✓ $f"
          done

      - name: Validar docker-compose.yml
        run: |
          # Cria .env dummy para que o docker compose config não falhe por variáveis ausentes
          cat > .env << 'ENVEOF'
          CLOUDFLARE_TUNNEL_TOKEN=dummy
          POSTGRES_USER=dummy
          POSTGRES_PASSWORD=dummy
          POSTGRES_DB=dummy
          SECRET_KEY=dummy
          DATABASE_URL=postgresql://dummy:dummy@postgres:5432/dummy
          OPENAI_API_KEY=dummy
          CORS_ORIGINS=dummy
          ENVIRONMENT=ci
          LOG_LEVEL=INFO
          ENVEOF
          docker compose -f docker-compose.yml config --quiet
          echo "✓ docker-compose.yml válido"

  # ----------------------------------------------------------
  # JOB 2: Deploy na VPS + Migrations
  # ----------------------------------------------------------
  deploy:
    name: 🚀 Deploy VPS + Migrations
    runs-on: ubuntu-latest
    needs: lint
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    permissions:
      contents: read
    environment: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 Copiar código para VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='node_modules' \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT || 22 }}" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_DIR }}/

      - name: 🗄️ Criar .env na VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.VPS_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENVCMD'
          cat << 'EOF' | sed 's/^[ \t]*//' > ${{ env.DEPLOY_DIR }}/.env
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            POSTGRES_DB=copilotprotheus
            POSTGRES_USER=copilot
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=postgresql://copilot:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/copilotprotheus
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            ENVIRONMENT=production
            LOG_LEVEL=INFO
          EOF
          chmod 600 ${{ env.DEPLOY_DIR }}/.env
          echo "✓ .env criado na VPS"
          ENVCMD

      - name: 🐘 Executar Migrations PostgreSQL
        if: ${{ github.event.inputs.run_migrations != 'false' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ env.DEPLOY_DIR }}
            
            if [ "${{ github.event.inputs.wipe_database }}" = "true" ]; then
              echo "⚠️ ATENÇÃO: APAGANDO BANCO DE DADOS ATUAL!"
              docker compose down -v db
            fi
            
            echo "=== Garantindo que o PostgreSQL está rodando ==="
            docker compose up -d db
            sleep 5

            echo "=== Sincronizando senha do banco de dados ==="
            docker compose exec -T db psql -U postgres -c "ALTER USER copilot WITH PASSWORD '${{ secrets.POSTGRES_PASSWORD }}';" || true
            docker compose exec -T db psql -U copilot -d copilotprotheus -c "ALTER USER copilot WITH PASSWORD '${{ secrets.POSTGRES_PASSWORD }}';" || true
          DBCMD

          echo "=== Executando migrations em ordem ==="
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'MIGCMD'
            cd ${{ env.DEPLOY_DIR }}
            for sql_file in $(ls database/migrations/*.sql 2>/dev/null | sort); do
              echo "→ Aplicando: $sql_file"
              docker compose exec -T db psql \
                -U copilot \
                -d copilotprotheus \
                -f /dev/stdin < "$sql_file" \
                && echo "  ✓ $sql_file aplicado" \
                || echo "  ⚠ $sql_file já aplicado ou erro ignorável"
            done

            echo "=== Migrations concluídas ==="
          EOF

      - name: 🔄 Restart containers
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.VPS_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'RESTARTCMD'
          set -e
          cd ${{ env.DEPLOY_DIR }}

          echo "=== Build e restart dos containers ==="
          docker compose pull --quiet 2>/dev/null || true
          docker compose up -d --build --remove-orphans

          echo "=== Status dos containers ==="
          docker compose ps
          RESTARTCMD

      - name: 🏥 Health Check no Backend
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'HEALTHCMD'
          echo "Verificando backend local (http://localhost:8000/health)..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check OK (HTTP $STATUS)"
              exit 0
            fi
            echo "  Tentativa $i — HTTP $STATUS — aguardando 10s..."
            sleep 10
          done
          echo "❌ Health check falhou após 5 tentativas"
          echo "--- LOGS DO BACKEND ---"
          docker compose -f ${{ env.DEPLOY_DIR }}/docker-compose.yml logs backend --tail 50
          exit 1
          HEALTHCMD

      - name: 📊 Resumo do Deploy
        if: always()
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repositório | goistechsolutions/copilotprotheus |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ github.event.inputs.run_migrations || 'true' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data/Hora | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
