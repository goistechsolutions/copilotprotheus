name: Deploy Admin → Cloudflare Pages

on:
  push:
    branches: [main, hml]
    paths:
      - 'admin-frontend/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
      CF_PAGES_PROJECT: ${{ github.ref_name == 'main' && 'copilotprotheus-admin' || 'copilotprotheus-admin-hml' }}
      CF_PRODUCTION_BRANCH: ${{ github.ref_name == 'main' && 'main' || 'hml' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          test -d admin-frontend || (echo "::error::Diretório admin-frontend não encontrado." && exit 1)
          test -f admin-frontend/package.json || (echo "::error::admin-frontend/package.json não encontrado." && exit 1)
          test -f admin-frontend/package-lock.json || (echo "::error::admin-frontend/package-lock.json não encontrado. Faça commit do lockfile." && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        working-directory: admin-frontend
        run: npm ci

      - name: Build (${{ env.APP_ENV }})
        working-directory: admin-frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_ENV: ${{ env.APP_ENV }}

      - name: Garantir projeto Cloudflare Pages existe
        run: |
          set -e

          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          PROJECT="${CF_PAGES_PROJECT}"
          PROD_BRANCH="${CF_PRODUCTION_BRANCH}"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT")

          if [ "$STATUS" = "200" ]; then
            echo "✅ Projeto '$PROJECT' já existe."
          else
            echo "🔧 Projeto '$PROJECT' não encontrado (HTTP $STATUS). Criando..."
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"$PROD_BRANCH\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects")

            SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(str(json.load(sys.stdin).get('success', False)).lower())")
            if [ "$SUCCESS" = "true" ]; then
              echo "✅ Projeto '$PROJECT' criado com sucesso."
            else
              echo "❌ Falha ao criar projeto: $RESPONSE"
              exit 1
            fi
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: admin-frontend
        run: |
          npx wrangler@3 pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch="${{ github.ref_name }}" \
            --commit-dirty=true \
            --commit-hash="${{ github.sha }}" \
            --commit-message="${{ github.event.head_commit.message }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resumo
        run: |
          echo "✅ Admin [${{ env.APP_ENV }}] → project: ${{ env.CF_PAGES_PROJECT }} / branch: ${{ github.ref_name }}"

      - name: Notificar falha
        if: failure()
        run: |
          echo "::error::Deploy Admin [${{ env.APP_ENV }}] falhou. Branch: ${{ github.ref_name }}."
