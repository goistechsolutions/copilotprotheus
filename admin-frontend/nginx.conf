server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA React com base: '/admin/' — serve o app no subpath /admin/
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Redireciona raiz para /admin/
    location = / {
        return 301 /admin/;
    }

    # Proxy API calls para o backend FastAPI
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header  Authorization;
        proxy_read_timeout 120s;
    }

    # Proxy para o Adminer (PostgreSQL web client)
    location /adminer/ {
        proxy_pass         http://adminer:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Cache de assets estáticos (dentro do /admin/)
    location ~* ^/admin/assets/.*\.(js|css|png|jpg|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
