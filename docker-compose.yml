services:
  db:
    image: pgvector/pgvector:pg16
    container_name: copilot-protheus-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: copilot-protheus-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: copilot-protheus-middleware
    ports:
      - "3001:3001"
    env_file:
      - ./middleware/.env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: copilot-protheus-frontend
    ports:
      - "5173:80"
    depends_on:
      - middleware
    restart: always

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: copilot-protheus-admin-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: always

  adminer:
    image: adminer:latest
    container_name: copilot-protheus-adminer
    profiles:
      - tools   # só sobe com: docker compose --profile tools up
    environment:
      - ADMINER_DEFAULT_DB_DRIVER=pgsql
      - ADMINER_DEFAULT_DB_HOST=db
      - ADMINER_DEFAULT_DB_NAME=${POSTGRES_DB}
      - ADMINER_DESIGN=pepa-linha
    ports:
      - "127.0.0.1:8080:8080"   # bind local apenas
    depends_on:
      - db
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: copilot-protheus-cloudflared
    env_file:
      - ./.env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
